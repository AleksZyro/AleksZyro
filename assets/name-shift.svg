<svg xmlns="http://www.w3.org/2000/svg" width="980" height="228" viewBox="0 0 980 228" role="img" aria-label="Aleksandar Nikolic developer banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1730" />
      <stop offset="100%" stop-color="#102244" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8e7ff" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;420 0" dur="11s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#030917" flood-opacity="0.28" />
    </filter>
    <style>
      .title {
        font: 800 70px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: url(#title-fill);
        text-anchor: middle;
      }
      .subtitle {
        font: 600 22px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #d8e6fb;
        text-anchor: middle;
      }
      .stack-label {
        font: 700 18px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #eef5ff;
      }
    </style>
  </defs>

  <rect width="980" height="228" rx="28" fill="url(#bg)" />
  <rect width="980" height="228" rx="28" fill="url(#glow)" />
  <rect x="1.5" y="1.5" width="977" height="225" rx="26.5" fill="none" stroke="#2f5d99" stroke-opacity="0.76" />

  <g filter="url(#soft-shadow)">
    <text class="title" x="490" y="102">Aleksandar Nikolic</text>
    <text class="title" x="490" y="102" fill="url(#shine)" opacity="0.92">Aleksandar Nikolic</text>

    <g transform="translate(296 124)">
      <g transform="translate(0 0)">
        <g transform="translate(1 1) scale(0.78)">
          <path d="M 24 2 C 14 2 13 6.3 13 11 V 18 H 35 V 21 H 3 C 3 21 -3 20.8 -3 33 C -3 45.2 2.3 46 2.3 46 H 14 V 29 C 14 29 13.3 21 22 21 H 36 C 36 21 48 21.2 48 9.5 V 12 C 48 4.2 41.3 2 34 2 Z" fill="#3776ab"/>
          <circle cx="25.2" cy="9.8" r="2" fill="#ffffff"/>
          <path d="M 24 58 C 34 58 35 53.7 35 49 V 42 H 13 V 39 H 45 C 45 39 51 39.2 51 27 C 51 14.8 45.7 14 45.7 14 H 34 V 31 C 34 31 34.7 39 26 39 H 12 C 12 39 0 38.8 0 50.5 V 48 C 0 55.8 6.7 58 14 58 Z" fill="#ffd343"/>
          <circle cx="22.8" cy="50.2" r="2" fill="#ffffff"/>
        </g>
        <text class="stack-label" x="50" y="25">Python</text>
      </g>
      <g transform="translate(176 0)">
        <rect x="0" y="2" width="40" height="40" rx="10" fill="#f7df1e" />
        <text x="9" y="28" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#0d1117">JS</text>
        <text class="stack-label" x="56" y="25">JavaScript</text>
      </g>
      <g transform="translate(420 0)">
        <rect x="0" y="2" width="40" height="40" rx="12" fill="#512bd4" />
        <text x="8" y="28" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#ffffff">C#</text>
      </g>
    </g>

    <text class="subtitle" x="490" y="198">Swiss student developer building useful tools and polished interfaces.</text>
  </g>
</svg>
