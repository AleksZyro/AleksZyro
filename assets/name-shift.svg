<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-label="Aleksandar Nikolic developer banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111f" />
      <stop offset="50%" stop-color="#0d1830" />
      <stop offset="100%" stop-color="#0a1427" />
    </linearGradient>
    <radialGradient id="glow-left" cx="20%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="82%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d7e8ff" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;420 0" dur="11s" repeatCount="indefinite" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#173056" stroke-opacity="0.28" stroke-width="1" />
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020814" flood-opacity="0.32" />
    </filter>
    <style>
      .title {
        font: 800 68px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: url(#title-fill);
        text-anchor: middle;
      }
      .subtitle {
        font: 600 24px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #d7e8ff;
        text-anchor: middle;
      }
      .mark {
        font: 700 15px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #8fbaff;
        opacity: 0.22;
        letter-spacing: 0.12em;
      }
    </style>
  </defs>

  <rect width="980" height="250" rx="28" fill="url(#bg)" />
  <rect width="980" height="250" rx="28" fill="url(#grid)" opacity="0.86" />
  <rect x="1.5" y="1.5" width="977" height="247" rx="26.5" fill="none" stroke="#244a82" stroke-opacity="0.8" />
  <rect x="18" y="18" width="944" height="214" rx="22" fill="none" stroke="#173a68" stroke-opacity="0.42" />
  <rect width="980" height="250" rx="28" fill="url(#glow-left)" />
  <rect width="980" height="250" rx="28" fill="url(#glow-right)" />

  <g opacity="0.8">
    <circle cx="120" cy="60" r="18" fill="#3776ab" opacity="0.22" />
    <path d="M 111 52 h 13 a 5 5 0 0 1 5 5 v 7 h -11 a 5 5 0 0 1 -5 -5 z" fill="#ffd343" opacity="0.7" />
    <text class="mark" x="146" y="66">PYTHON</text>

    <rect x="800" y="44" width="32" height="32" rx="8" fill="#f7df1e" opacity="0.82" />
    <text x="808" y="65" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="16" font-weight="800" fill="#0d1117">JS</text>
    <text class="mark" x="846" y="66">JAVASCRIPT</text>

    <rect x="130" y="181" width="30" height="24" rx="8" fill="#512bd4" opacity="0.46" />
    <text x="138" y="198" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="15" font-weight="800" fill="#ffffff" opacity="0.8">C#</text>
    <text class="mark" x="176" y="198">APPS</text>

    <ellipse cx="830" cy="192" rx="18" ry="12" fill="#2f81f7" opacity="0.18" />
    <path d="M 820 186 h 20 a 6 6 0 0 1 0 12 h -20 a 6 6 0 0 1 0 -12 z" fill="#2f81f7" opacity="0.72" />
    <text class="mark" x="858" y="198">SQL</text>
  </g>

  <g filter="url(#soft-shadow)">
    <text class="title" x="490" y="128">Aleksandar Nikolic</text>
    <text class="title" x="490" y="128" fill="url(#shine)" opacity="0.92">Aleksandar Nikolic</text>
    <text class="subtitle" x="490" y="170">Student developer from Switzerland building projects that feel clean, useful, and alive.</text>
  </g>
</svg>
