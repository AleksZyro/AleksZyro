<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-label="Aleksandar Nikolic developer banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111f" />
      <stop offset="50%" stop-color="#0d1830" />
      <stop offset="100%" stop-color="#0a1427" />
    </linearGradient>
    <radialGradient id="glow-left" cx="20%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="82%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d7e8ff" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;420 0" dur="11s" repeatCount="indefinite" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#173056" stroke-opacity="0.28" stroke-width="1" />
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020814" flood-opacity="0.32" />
    </filter>
    <style>
      .title {
        font: 800 68px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: url(#title-fill);
        text-anchor: middle;
      }
      .subtitle {
        font: 600 24px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #d7e8ff;
        text-anchor: middle;
      }
      .caption {
        font: 600 15px 'Consolas', 'Courier New', monospace;
        fill: #8fbaff;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-anchor: middle;
      }
      .chip-label {
        font: 700 17px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #f5f9ff;
      }
      .chip-meta {
        font: 600 12px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #8fbaff;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <rect width="980" height="280" rx="28" fill="url(#bg)" />
  <rect width="980" height="280" rx="28" fill="url(#grid)" opacity="0.9" />
  <rect x="1.5" y="1.5" width="977" height="277" rx="26.5" fill="none" stroke="#244a82" stroke-opacity="0.8" />
  <rect x="18" y="18" width="944" height="244" rx="22" fill="none" stroke="#173a68" stroke-opacity="0.45" />
  <rect width="980" height="280" rx="28" fill="url(#glow-left)" />
  <rect width="980" height="280" rx="28" fill="url(#glow-right)" />

  <g opacity="0.85">
    <circle cx="96" cy="72" r="3" fill="#58a6ff" />
    <circle cx="132" cy="72" r="3" fill="#58a6ff" opacity="0.5" />
    <circle cx="168" cy="72" r="3" fill="#58a6ff" opacity="0.25" />
    <path d="M 90 72 H 176" stroke="#58a6ff" stroke-opacity="0.16" />

    <circle cx="804" cy="214" r="3" fill="#58a6ff" />
    <circle cx="840" cy="214" r="3" fill="#58a6ff" opacity="0.5" />
    <circle cx="876" cy="214" r="3" fill="#58a6ff" opacity="0.25" />
    <path d="M 798 214 H 884" stroke="#58a6ff" stroke-opacity="0.16" />
  </g>

  <g filter="url(#soft-shadow)">
    <text class="caption" x="490" y="74">Practical tools • polished UI • playful builds</text>
    <text class="title" x="490" y="142">Aleksandar Nikolic</text>
    <text class="title" x="490" y="142" fill="url(#shine)" opacity="0.92">Aleksandar Nikolic</text>
    <text class="subtitle" x="490" y="187">Student developer from Switzerland building projects that feel clean, useful, and alive.</text>
  </g>

  <g transform="translate(68 42)">
    <rect width="150" height="54" rx="15" fill="#0f213e" stroke="#2c558e" />
    <circle cx="26" cy="27" r="11" fill="#3776ab" />
    <path d="M 20 21 h 9 a 4 4 0 0 1 4 4 v 5 h -8 a 4 4 0 0 1 -4 -4 z" fill="#ffd343" opacity="0.95" />
    <path d="M 32 33 h -9 a 4 4 0 0 1 -4 -4 v -5 h 8 a 4 4 0 0 1 4 4 z" fill="#ffffff" opacity="0.14" />
    <text class="chip-meta" x="49" y="20">Language</text>
    <text class="chip-label" x="49" y="36">Python</text>
  </g>

  <g transform="translate(762 42)">
    <rect width="150" height="54" rx="15" fill="#0f213e" stroke="#2c558e" />
    <rect x="16" y="16" width="22" height="22" rx="5" fill="#f7df1e" />
    <text x="21" y="32" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="14" font-weight="800" fill="#0d1117">JS</text>
    <text class="chip-meta" x="49" y="20">Frontend</text>
    <text class="chip-label" x="49" y="36">JavaScript</text>
  </g>

  <g transform="translate(116 196)">
    <rect width="146" height="46" rx="14" fill="#0f213e" stroke="#2a507f" />
    <rect x="14" y="11" width="28" height="24" rx="7" fill="#512bd4" />
    <text x="21" y="28" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="15" font-weight="800" fill="#ffffff">C#</text>
    <text class="chip-label" x="51" y="29">C# apps</text>
  </g>

  <g transform="translate(320 196)">
    <rect width="146" height="46" rx="14" fill="#0f213e" stroke="#2a507f" />
    <rect x="14" y="11" width="28" height="24" rx="7" fill="#e34f26" />
    <path d="M 23 16 l 2 14 3 -2 3 2 2 -14 z" fill="#ffffff" opacity="0.92" />
    <text class="chip-label" x="51" y="29">HTML/CSS</text>
  </g>

  <g transform="translate(524 196)">
    <rect width="146" height="46" rx="14" fill="#0f213e" stroke="#2a507f" />
    <rect x="15" y="12" width="26" height="22" rx="6" fill="#264de4" />
    <path d="M 23 17 h 10 l -1 11 -4 2 -4 -2 z" fill="#ffffff" opacity="0.94" />
    <text class="chip-label" x="51" y="29">CSS polish</text>
  </g>

  <g transform="translate(728 196)">
    <rect width="146" height="46" rx="14" fill="#0f213e" stroke="#2a507f" />
    <ellipse cx="28" cy="23" rx="13" ry="11" fill="#2f81f7" opacity="0.16" />
    <path d="M 21 17 h 14 a 5 5 0 0 1 0 10 h -14 a 5 5 0 0 1 0 -10 z" fill="#2f81f7" />
    <text class="chip-label" x="51" y="29">SQL data</text>
  </g>
</svg>
