<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-label="Aleksandar Nikolic profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="48%" stop-color="#10294a" />
      <stop offset="100%" stop-color="#0a1628" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="55%" stop-color="#ffd54a" />
      <stop offset="100%" stop-color="#67d9ff" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .name {
        font: 800 46px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #f0f6fc;
        text-anchor: middle;
      }
      .role {
        font: 700 17px 'Consolas', 'Courier New', monospace;
        letter-spacing: 3px;
        fill: #9fc7ff;
        text-anchor: middle;
      }
      .claim {
        font: 600 17px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #d8e7fb;
        text-anchor: middle;
      }
      .chip-text {
        font: 700 12px 'Segoe UI', 'Trebuchet MS', sans-serif;
        fill: #dce9ff;
        text-anchor: middle;
      }
      .tiny {
        font: 700 11px 'Consolas', 'Courier New', monospace;
        fill: #6fb8ff;
        text-anchor: middle;
      }
      .frame { fill: url(#bg); stroke: #255895; stroke-width: 1.4; }
      .inner { fill: none; stroke: #2d5f9c; stroke-opacity: 0.45; }
      .grid { stroke: #1e3d64; stroke-width: 1; opacity: 0.35; }
      .chip { fill: #102844; stroke: #2c6aa8; stroke-width: 1; }
    </style>
  </defs>

  <rect x="12" y="12" width="956" height="256" rx="28" class="frame" />
  <rect x="34" y="34" width="912" height="212" rx="20" class="inner" />

  <g class="grid">
    <path d="M88 34 V246 M188 34 V246 M288 34 V246 M388 34 V246 M488 34 V246 M588 34 V246 M688 34 V246 M788 34 V246 M888 34 V246" />
    <path d="M34 80 H946 M34 126 H946 M34 172 H946 M34 218 H946" />
  </g>

  <circle cx="112" cy="84" r="34" fill="#16385f" opacity="0.8" />
  <circle cx="112" cy="84" r="18" fill="#ffd54a" opacity="0.95" />
  <path d="M112 84 L132 73 L132 95 Z" fill="#16385f" />
  <circle cx="866" cy="196" r="31" fill="#16385f" opacity="0.78" />
  <path d="M848 206 L848 187 C848 176 856 169 866 169 C876 169 884 176 884 187 L884 206 L877 201 L870 206 L866 201 L859 206 L852 201 Z" fill="#ff5d6c" opacity="0.95" />
  <circle cx="860" cy="187" r="3.5" fill="#f5fbff" />
  <circle cx="873" cy="187" r="3.5" fill="#f5fbff" />

  <rect x="260" y="44" width="460" height="5" rx="2.5" fill="url(#accent)" opacity="0.9" filter="url(#softGlow)" />
  <text class="tiny" x="490" y="72">IMS STUDENT DEVELOPER</text>
  <text class="name" x="490" y="132">Aleksandar Nikolic</text>
  <text class="claim" x="490" y="169">3rd-year IMS student building practical software, clean interfaces, and useful tools.</text>
  <text class="claim" x="490" y="196">Looking for a Swiss software internship for the 2027/2028 practical year.</text>

  <g transform="translate(257 218)">
    <rect class="chip" x="0" y="0" width="134" height="30" rx="15" />
    <text class="chip-text" x="67" y="20">Python</text>
  </g>
  <g transform="translate(423 218)">
    <rect class="chip" x="0" y="0" width="134" height="30" rx="15" />
    <text class="chip-text" x="67" y="20">JavaScript</text>
  </g>
  <g transform="translate(589 218)">
