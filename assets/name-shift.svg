<svg xmlns="http://www.w3.org/2000/svg" width="980" height="228" viewBox="0 0 980 228" role="img" aria-label="Aleksandar Nikolic developer banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1730" />
      <stop offset="100%" stop-color="#102244" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8e7ff" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;420 0" dur="11s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#030917" flood-opacity="0.28" />
    </filter>
    <style>
