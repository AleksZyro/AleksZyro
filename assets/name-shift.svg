      <stop offset="0%" stop-color="#f3f7ff" stop-opacity="0.96" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#d9e9ff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#f3f7ff" stop-opacity="0.96" />
