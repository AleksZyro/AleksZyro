name: Pac-Man Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "55 21 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/generate_pacman_contrib.py"
      - ".github/workflows/pacman-contributions.yml"

permissions:
  contents: write

concurrency:
  group: pacman-contributions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Pac-Man contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Aleksandros2
        run: python scripts/generate_pacman_contrib.py

      - name: Check for SVG changes
        id: changes
        run: |
          if git diff --quiet -- assets/pacman-contrib.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SVG changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SVG changed."
          fi

      - name: Prepare publish folder
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p publish/assets
          cp assets/pacman-contrib.svg publish/assets/pacman-contrib.svg

      - name: Publish generated SVG branch
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pacman-assets
          publish_dir: ./publish
          keep_files: false
          force_orphan: true
          commit_message: "chore: update pacman contribution animation"
