name: Pac-Man Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_pacman_contrib.py"
      - ".github/workflows/pacman-contributions.yml"

permissions:
  contents: write

concurrency:
  group: pacman-contributions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Generate profile SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: AleksZyro
        run: python scripts/generate_pacman_contrib.py

      - name: Check for generated SVG changes
        id: changes
        run: |
          if git diff --quiet -- assets/pacman-contrib.svg assets/language-stats.svg assets/profile-stats.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated SVG changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated SVGs changed."
          fi

      - name: Prepare publish folder
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p publish/assets
          cp assets/pacman-contrib.svg publish/assets/pacman-contrib.svg
          cp assets/language-stats.svg publish/assets/language-stats.svg
          cp assets/profile-stats.svg publish/assets/profile-stats.svg

      - name: Publish generated SVG branch
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pacman-assets
          publish_dir: ./publish
          keep_files: false
          force_orphan: true
          commit_message: "chore: update generated profile assets"
