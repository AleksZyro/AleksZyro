name: Pac-Man Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/generate_pacman_contrib.py"
      - ".github/workflows/pacman-contributions.yml"
      - "README.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pacman-contributions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Pac-Man contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Aleksandros2
        run: python scripts/generate_pacman_contrib.py

      - name: Check for SVG changes
        id: changes
        run: |
          if git diff --quiet -- assets/pacman-contrib.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SVG changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SVG changed."
          fi

      - name: Create pull request for SVG update
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            assets/pacman-contrib.svg
          commit-message: "chore: update pacman contribution animation"
          branch: "bot/pacman-contrib-update"
          delete-branch: true
          title: "chore: update pacman contribution animation"
          body: |
            Automated Pac-Man contribution SVG refresh.
            - No direct bot commit to `main`
            - PR is created only when `assets/pacman-contrib.svg` actually changed
